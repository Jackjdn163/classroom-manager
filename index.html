<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Priorities</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a73e8">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --border: #e2e6eb;
      --accent: #1a73e8; --missing: #d93025; --missing-bg: #fdecea; --urgent: #e37400; --urgent-bg: #fef3e0;
      --soon: #1a73e8; --soon-bg: #e8f0fe; --later: #5f6b7a; --later-bg: #eef0f3; --done: #188038; --done-bg: #e6f4ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417; --card: #1c1f24; --text: #e8eaed; --muted: #9aa0a6; --border: #2e333a;
        --accent: #8ab4f8; --missing: #f28b82; --missing-bg: #3a1f1d; --urgent: #fdd663; --urgent-bg: #3a3020;
        --soon: #8ab4f8; --soon-bg: #1f2a3d; --later: #9aa0a6; --later-bg: #262a30; --done: #81c995; --done-bg: #1e3326;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 24px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    button { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { button.primary { color: #121417; } }
    button:disabled { opacity: .6; cursor: default; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 20px 0; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stat.missing b { color: var(--missing); } .stat.urgent b { color: var(--urgent); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
    .controls input[type=search], .controls select { font: inherit; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .controls input[type=search] { flex: 1 1 200px; min-width: 0; }
    .controls label { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 0 8px; }
    ol { list-style: none; margin: 0; padding: 0; }
    li.item { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--border);
      border-left: 4px solid var(--tier); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
    .rank { font-weight: 700; color: var(--muted); min-width: 24px; text-align: right; }
    .body { flex: 1; min-width: 0; }
    .title { font-weight: 600; color: var(--text); text-decoration: none; word-break: break-word; }
    .title:hover { color: var(--accent); text-decoration: underline; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      color: var(--tier); background: var(--tier-bg); white-space: nowrap; }
    .open { white-space: nowrap; font-size: 13px; color: var(--accent); text-decoration: none; align-self: center; }
    .hide-btn { font-size: 12px; padding: 2px 10px; color: var(--muted); }
    .removed { opacity: .5; }
    .removed .title { text-decoration: line-through; }
    .t-missing { --tier: var(--missing); --tier-bg: var(--missing-bg); }
    .t-urgent  { --tier: var(--urgent);  --tier-bg: var(--urgent-bg); }
    .t-soon    { --tier: var(--soon);    --tier-bg: var(--soon-bg); }
    .t-later, .t-nodate { --tier: var(--later); --tier-bg: var(--later-bg); }
    .t-done    { --tier: var(--done);    --tier-bg: var(--done-bg); }
    .notice { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 20px; }
    .error { border-color: var(--missing); color: var(--missing); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; }
    .seg button.active { background: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { .seg button.active { color: #121417; } }
    .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .cal-head h3 { margin: 0; font-size: 18px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .cal-dow { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0; }
    .cal-day { background: var(--card); border: 1px solid var(--border); border-radius: 8px; min-height: 96px;
      padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cal-day:hover { border-color: var(--accent); }
    .cal-day.other { opacity: .45; }
    .cal-day.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
    .cal-day .num { font-size: 12px; font-weight: 600; align-self: flex-start; padding: 0 5px; }
    .cal-day.today .num { background: var(--accent); color: #fff; border-radius: 999px; }
    @media (prefers-color-scheme: dark) { .cal-day.today .num { color: #121417; } }
    .chip { display: block; font-size: 11.5px; padding: 1px 5px; border-radius: 4px; background: var(--tier-bg);
      color: var(--tier); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
    .chip:hover { text-decoration: underline; }
    .more { font-size: 11px; color: var(--muted); padding-left: 5px; }
    .dots { display: none; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tier); }
    .cal-head .seg button { padding: 8px 12px; }
    .cal-grid.week .cal-day { min-height: 220px; }
    .cal-grid.week .chip { white-space: normal; overflow: visible; line-height: 1.3; padding: 3px 5px; }
    @media (max-width: 600px) {
      .cal-day { min-height: 54px; }
      .chip, .more { display: none; }
      .dots { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 3px; }
      /* Week view on phones: one day per row with full assignment names */
      .cal-grid.week { grid-template-columns: 1fr; }
      .cal-grid.week .cal-dow, .cal-grid.week .dots { display: none; }
      .cal-grid.week .cal-day { min-height: 0; }
      .cal-grid.week .chip { display: block; font-size: 13px; }
    }
    .chip.ev { background: transparent; color: var(--text); border-left: 3px solid var(--ev); border-radius: 3px; }
    .dot.ev { background: var(--ev); }
    li.ev-item { border-left-color: var(--ev); }
    .active-outline { border-color: var(--accent); color: var(--accent); }
    .cal-panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .cal-panel p { margin: 0 0 8px; }
    .cal-panel p.sub:last-child { margin: 8px 0 0; }
    .cal-option { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
    .plan-bar { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 20px; }
    .plan-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .plan-bar h2 { margin: 14px 0 8px; }
    .plan-bar > p { margin: 10px 0 0; }
    .plan-note { color: var(--urgent); font-size: 14px; }
    .plan-warn { color: var(--missing); font-size: 14px; }
    li.plan-item { border-left: 4px dashed var(--accent); }
    li.plan-item.soft { border-left-color: var(--urgent); }
    li.plan-item.past { opacity: .55; }
    .chip.plan { background: transparent; color: var(--accent); border: 1px dashed var(--accent); }
    .chip.plan.soft { color: var(--urgent); border-color: var(--urgent); }
    .dot.plan { background: transparent; border: 1.5px solid var(--accent); }
    .est { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); margin-top: 4px; }
    .est select { font: inherit; font-size: 13px; padding: 1px 4px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .est .guess { font-style: italic; }
    .item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .pickers { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .notes { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; }
    span.title { font-weight: 600; }
    .done-btn { color: var(--done); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center;
      padding: 40px 16px; overflow-y: auto; z-index: 10; }
    .modal { background: var(--card); color: var(--text); border-radius: 12px; padding: 18px; width: 100%; max-width: 440px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
    .modal.wide { max-width: 600px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-head h3 { margin: 0; font-size: 18px; }
    .modal-head button { border: 0; font-size: 16px; }
    .form { display: flex; flex-direction: column; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1; min-width: 0; }
    .field input, .field select, .field textarea { font: inherit; font-size: 15px; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
    .field-row { display: flex; gap: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    button.danger { color: var(--missing); border-color: var(--missing); margin-right: auto; }
    .import-row { margin: 4px 0 0; }
    .plan-top button { white-space: nowrap; }
    .plan-tabs { margin-top: 12px; }
    .block-check { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--done); }
    li.plan-item.done { opacity: .6; }
    li.plan-item.done .title { text-decoration: line-through; }
    .week-table { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .week-row { display: grid; grid-template-columns: 110px 1fr 150px; grid-template-areas: "day bar mins" "due due due";
      gap: 2px 10px; align-items: center; text-align: left; padding: 8px 10px; }
    .week-day { grid-area: day; font-weight: 600; font-size: 14px; }
    .week-bar-wrap { grid-area: bar; height: 8px; background: var(--later-bg); border-radius: 4px; overflow: hidden; }
    .week-bar { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
    .week-mins { grid-area: mins; font-size: 13px; color: var(--muted); text-align: right; }
    .week-due { grid-area: due; font-size: 12px; color: var(--muted); }
    .week-due:empty { display: none; }
    @media (max-width: 600px) { .week-row { grid-template-columns: 90px 1fr; grid-template-areas: "day mins" "bar bar" "due due"; } }
    .day-picks { display: flex; flex-wrap: wrap; gap: 6px; }
    .day-pick { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 8px; }
    .field .day-picks input { width: auto; }
    .field-row.align-end { align-items: flex-end; }
    .chips-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .off-chip { font-size: 13px; background: var(--later-bg); border-radius: 999px; padding: 2px 4px 2px 10px; }
    .off-chip button { border: 0; padding: 0 6px; background: transparent; font-size: 12px; }
    .header-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .task-list { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow-y: auto; }
    .task-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    .task-row input { margin-top: 3px; }
    .task-info { display: flex; flex-direction: column; }
    .task-title { font-weight: 600; color: var(--text); }
    .class-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
    .link-btn { border: 0; background: transparent; color: var(--accent); padding: 2px 4px; font-size: 13px; }
    .checklist-wrap { flex-basis: 100%; }
    .checklist { list-style: none; margin: 4px 0; padding: 0; }
    .checklist li { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 2px 0; }
    .checklist li.done label { text-decoration: line-through; color: var(--muted); }
    .add-step { display: flex; gap: 6px; align-items: center; }
    .add-step input { font: inherit; font-size: 14px; flex: 1; min-width: 0; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); }
    .chip.busy { background: var(--later-bg); color: var(--muted); }
    .dot.busy { background: var(--muted); }
    .busy-list { display: flex; flex-direction: column; gap: 6px; }
    .busy-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
    .modal h4 { margin: 14px 0 6px; font-size: 14px; }
    .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
    .color-pick { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .color-pick input { width: 28px; height: 22px; padding: 0; border: 0; background: none; }
    .smart-preview { min-height: 1.2em; }
    .right-now { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 20px; }
    .rn-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 10px; }
    .rn-status { font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
    .rn-status.ok { color: var(--done); background: var(--done-bg); }
    .rn-status.focus { color: var(--urgent); background: var(--urgent-bg); }
    .rn-status.warn { color: var(--missing); background: var(--missing-bg); }
    .rn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
    .rn-info { min-width: 0; flex: 1 1 240px; }
    .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .rn-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .rn-clock { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; margin-right: 4px; }
    /* Week view: hour-by-hour grid */
    body.wide main { max-width: 1500px; }
    .wk-scroll { overflow: auto; max-height: 78vh; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
    .wk-grid { display: grid; grid-template-columns: 58px repeat(7, minmax(140px, 1fr)); min-width: 1038px; }
    .wk-corner, .wk-head { position: sticky; top: 0; z-index: 3; background: var(--card); border-bottom: 1px solid var(--border); }
    .wk-corner { left: 0; z-index: 4; }
    .wk-head { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 10px 10px 8px; border: 0;
      border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 0; text-align: left; cursor: pointer; min-width: 0; }
    .wk-head.selected { box-shadow: inset 0 -3px 0 var(--accent); }
    .wk-dow { font-weight: 700; font-size: 16px; color: var(--text); }
    .wk-head.today .wk-dow { color: var(--accent); }
    .wk-date { font-size: 13px; color: var(--muted); }
    .wk-ab { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--soon-bg); border-radius: 999px; padding: 2px 10px; margin-top: 2px; }
    .wk-ab.off { color: var(--muted); background: var(--later-bg); }
    .wk-allday { font-size: 11px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--ev); padding-left: 5px; color: var(--muted); }
    .wk-gutter { position: sticky; left: 0; z-index: 2; background: var(--card); }
    .wk-hour { position: absolute; right: 8px; transform: translateY(-50%); font-size: 11px; font-weight: 600; color: var(--muted); }
    .wk-hour:first-child { transform: none; }
    .wk-col { position: relative; border-left: 1px solid var(--border);
      background-image: linear-gradient(to bottom, var(--border) 1px, transparent 1px); background-size: 100% var(--hour); }
    .wk-col.today { background-color: color-mix(in srgb, var(--accent) 4%, transparent); }
    .wk-ev { position: absolute; display: flex; flex-direction: column; overflow: hidden; border-radius: 8px; padding: 5px 8px;
      font-size: 12px; line-height: 1.25; text-decoration: none; color: var(--text); box-sizing: border-box; }
    .wk-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wk-sub { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wk-inline { display: none; font-weight: 500; }
    .wk-ev.compact { justify-content: center; padding-top: 2px; padding-bottom: 2px; }
    .wk-ev.compact .wk-sub { display: none; }
    .wk-ev.compact .wk-inline { display: inline; }
    .wk-ev.compact .wk-title { -webkit-line-clamp: 1 !important; white-space: nowrap; }
    .wk-ev.class { background: color-mix(in srgb, var(--c) 22%, var(--card)); border-left: 4px solid var(--c); }
    .wk-ev.class .wk-title { font-size: 13px; }
    .wk-note { display: block; margin-top: 3px; padding: 2px 6px; border: 0; border-radius: 5px; font: inherit; font-size: 11px; font-weight: 700;
      text-align: left; color: var(--tier); background: color-mix(in srgb, var(--card) 75%, transparent); overflow: hidden; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-decoration: none; cursor: pointer; max-width: 100%; width: fit-content; }
    .wk-note:hover { text-decoration: underline; }
    .wk-note.done { text-decoration: line-through; opacity: .7; }
    .wk-note.more { color: var(--muted); --tier: var(--muted); }
    .wk-ev.flex { border: 1.5px dashed var(--border); color: var(--muted); background: var(--bg); }
    .wk-ev.flex .wk-title { font-weight: 600; }
    .wk-ev.busy { background: var(--later-bg); color: var(--muted); }
    .wk-ev.event { background: color-mix(in srgb, var(--c) 14%, var(--card)); border-left: 3px solid var(--c); }
    .wk-ev.study { background: var(--card); border: 1.5px dashed var(--accent); border-left: 4px solid var(--c, var(--accent)); color: var(--accent); }
    .wk-ev.study.soft { border-color: var(--urgent); color: var(--urgent); }
    .wk-ev.study.done { opacity: .5; }
    .wk-ev.study.done .wk-title { text-decoration: line-through; }
    .wk-ev.due { background: var(--tier-bg); color: var(--tier); border-left: 3px solid var(--tier); padding: 4px 8px; justify-content: center; }
    .wk-ev.due .wk-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 11.5px; }
    .wk-ev.due .wk-sub { color: var(--tier); }
    .wk-ev.clickable, a.wk-ev { cursor: pointer; }
    .wk-ev.clickable:hover, a.wk-ev:hover { filter: brightness(.97); outline: 1px solid var(--accent); }
    .wk-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--missing); z-index: 1; pointer-events: none; }
    .wk-now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--missing); }
    .sched-table { display: flex; flex-direction: column; gap: 6px; }
    .sched-row { display: grid; grid-template-columns: 1.1fr .9fr .9fr 1.4fr 1.4fr 28px; gap: 6px; align-items: center; }
    .sched-row.same { grid-template-columns: 1.1fr .9fr .9fr 2fr 28px; }
    .sched-row.extra { grid-template-columns: 2fr 1fr 1fr 28px; }
    .sched-row.head span { font-size: 12px; color: var(--muted); }
    .sched-row input { font: inherit; font-size: 14px; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    .toggle-row { display: flex; gap: 8px; align-items: center; font-size: 14px; }
    @media (max-width: 600px) { .sched-row, .sched-row.same { grid-template-columns: 1fr 1fr; } .sched-row.head { display: none; } }
    /* Full-screen focus timer */
    .focus-overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      animation: fo-in .25s ease-out; overflow-y: auto; }
    .focus-overlay.no-anim { animation: none; }
    @keyframes fo-in { from { opacity: 0; transform: scale(.98); } }
    .fo-card { position: relative; width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      padding: 28px 28px 22px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.25);
      background-image: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--c) 16%, transparent), transparent 60%); }
    .fo-min { position: absolute; top: 14px; right: 14px; border: 0; background: transparent; color: var(--muted); font-size: 13px; }
    .fo-head { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 18px; }
    .fo-title { font-size: 24px; font-weight: 800; color: var(--text); text-decoration: none; line-height: 1.2; }
    a.fo-title:hover { text-decoration: underline; }
    .fo-meta { font-size: 14px; color: var(--muted); }
    .fo-ring { position: relative; width: min(300px, 70vw); aspect-ratio: 1; margin: 0 auto 22px; }
    .fo-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .fo-track { fill: none; stroke: var(--later-bg); stroke-width: 12; }
    .fo-progress { fill: none; stroke: var(--c); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .fo-progress.over { stroke: var(--done); }
    .fo-ring.paused .fo-progress { opacity: .45; }
    .fo-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .fo-time { font-size: clamp(44px, 12vw, 68px); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--text); }
    .fo-ring.paused .fo-time { animation: fo-blink 1.6s ease-in-out infinite; }
    @keyframes fo-blink { 50% { opacity: .35; } }
    .fo-label { font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 70%; }
    .fo-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .fo-controls button { padding: 10px 16px; border-radius: 12px; }
    .fo-main { background: var(--c); border-color: var(--c); color: #fff; font-weight: 700; min-width: 120px; }
    .fo-cancel { margin-top: 14px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .focus-overlay, .fo-progress, .fo-ring.paused .fo-time { animation: none; transition: none; } }
    /* Settings page */
    #settingsPage { display: none; }
    body.on-settings #settingsPage { display: grid; }
    body.on-settings #rightNow, body.on-settings #planBar, body.on-settings .stats, body.on-settings .controls,
    body.on-settings #lists, body.on-settings #calendar { display: none !important; }
    #settingsBtn.active { border-color: var(--accent); color: var(--accent); }
    .settings-page { margin-top: 20px; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; align-items: start; }
    .settings-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .settings-head h2 { margin: 0; font-size: 24px; text-transform: none; letter-spacing: 0; color: var(--text); }
    .settings-nav { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 2px; }
    .settings-nav button { border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px; color: var(--muted); }
    .settings-nav button:hover { background: var(--card); color: var(--text); }
    .settings-sections { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .settings-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; scroll-margin-top: 16px; }
    .settings-card > h3 { margin: 0 0 4px; font-size: 18px; }
    .settings-card > .sub:first-of-type { margin: 0 0 14px; }
    .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    @media (max-width: 760px) {
      .settings-page { grid-template-columns: minmax(0, 1fr); }
      .settings-nav { position: static; flex-direction: row; overflow-x: auto; gap: 4px; }
      .settings-nav button { white-space: nowrap; background: var(--card); }
    }
    .hidden { display: none !important; }
    code { background: var(--later-bg); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Classroom Priorities</h1>
      <div class="sub" id="status">Sign in with the Google account you use for Classroom.</div>
    </div>
    <div class="header-buttons">
      <button id="addBtn">+ Add assignment</button>
      <button id="notifyBtn">🔕 Reminders off</button>
      <button id="settingsBtn">⚙ Settings</button>
      <button id="demoBtn">Try demo</button>
      <button id="signInBtn" class="primary">Sign in with Google</button>
      <button id="refreshBtn" class="hidden">Refresh</button>
      <button id="signOutBtn" class="hidden" title="Sign out and clear saved data from this browser">Sign out</button>
    </div>
  </header>

  <div id="message" class="notice hidden"></div>

  <section id="app" class="hidden">
    <div id="rightNow" class="right-now hidden"></div>
    <div id="planBar" class="plan-bar"></div>
    <div class="stats">
      <div class="stat missing"><b id="sMissing">0</b><span>Missing</span></div>
      <div class="stat urgent"><b id="sUrgent">0</b><span>Due in next 48 hrs</span></div>
      <div class="stat"><b id="sWeek">0</b><span>Due in next 7 days</span></div>
      <div class="stat"><b id="sOpen">0</b><span>Total to do</span></div>
    </div>
    <div class="controls">
      <input type="search" id="search" placeholder="Search assignments…">
      <select id="courseFilter"><option value="">All classes</option></select>
      <label><input type="checkbox" id="showMissing" checked> Show missing</label>
      <label><input type="checkbox" id="showDone"> Show completed</label>
      <label><input type="checkbox" id="showRemoved"> Show removed<span id="removedCount"></span></label>
      <div class="seg" role="group" aria-label="View">
        <button id="listViewBtn" class="active">List</button>
        <button id="calViewBtn">Calendar</button>
      </div>
    </div>
    <div id="lists"></div>
    <div id="calendar" class="hidden"></div>
    <div id="settingsPage" class="settings-page"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="manual.js"></script>
<script src="planner.js"></script>
<script src="extras.js"></script>
<script src="schedule.js"></script>
<script src="google.js"></script>
<script src="notify.js"></script>
<script src="app.js"></script>
</body>
</html>
